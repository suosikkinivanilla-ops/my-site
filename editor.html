<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>制作专属邀请 · 和风传媒</title><link rel="stylesheet" href="styles.css"><style>main{max-width:720px;margin:auto;padding:30px 24px 60px}h1{font-family:var(--serif);font-weight:400;font-size:30px}form{margin-top:26px}form>label{display:block;margin-top:20px}.actions{display:flex;gap:10px;margin-top:24px}.actions>*{flex:1}.result{margin-top:25px;word-break:break-all}#link-output{min-height:120px}.help{font-size:12px;line-height:1.9;color:var(--muted)}#editor-error{color:#a74334;font-size:12px}.secondary-button{padding:12px}#preview{margin-top:15px}</style><script defer src="editor.js"></script></head><body><main><a class="brand" href="index.html"><span class="brand-mark">和</span><span>和风传媒<small>HEFENG MEDIA</small></span></a><h1>为她或他，写一封专属邀请。</h1><p class="help">填写后生成独立邀请链接。主播端只会看到邀请函。姓名与寄语包含在链接内；请单独发给对应主播。</p><form id="editor-form"><label>主播称呼<input id="guest" maxlength="24" placeholder="例如：小雨" required></label><label>想对主播说的话<textarea id="note" maxlength="240" required placeholder="写下沟通中真正打动你的具体特点。">你自然的表达，以及聊起热爱时眼里的光，给我们留下了很深的印象。我们相信，这份独特值得被更多人看见。</textarea></label><label>邀请编号<input id="code" maxlength="40" value="HF2026-001" required></label><label>预计合作启动时间<input id="date" type="date" value="2026-10-23" required style="width:100%;padding:14px;font-size:16px;margin-top:10px;border:1px solid #d7d7c9;background:#fffefa;border-radius:5px"></label><label>正式网页地址 <span class="optional">发布后自动填入，也可手动替换</span><input id="base-url" type="url" placeholder="https://你的域名/" style="width:100%;padding:14px;font-size:16px;margin-top:10px;border:1px solid #d7d7c9;background:#fffefa;border-radius:5px"></label><p class="help">本机预览链接只用于这台电脑。发给主播前，应使用已上线、手机可访问的 HTTPS 网页地址。</p><p id="editor-error" role="alert"></p><button class="primary-button" type="submit">生成这份专属邀请 ↗</button></form><section id="result" class="result" hidden><h2 style="font-size:24px">专属邀请已准备好</h2><label for="link-output">复制后单独发送</label><textarea id="link-output" readonly></textarea><div class="actions"><button id="copy-link" class="primary-button">复制链接</button><a id="preview" class="secondary-button" target="_blank" rel="noopener" style="margin:0;text-align:center">预览邀请函 ↗</a></div><p id="copy-status" class="help" role="status"></p></section></main></body></html>
